# 在 GitHub Actions 云端编译 PISEN WPR003N (immortalwrt 21.02, ath79/generic)
#
# 用途：用于和 18.06-k5.4 固件做开机内存/性能对比测试。
# 21.02 分支的 wpr003n 已存在(commit 来自 noame19 的 port),本 workflow 只编译不修改源码。
#
# 用法：
#   1. push 到 origin/openwrt-21.02(或手动 Run workflow)
#   2. 编译完成后在 Artifacts 下载 *pisen_wpr003n*-factory.bin / -sysupgrade.bin
#
# 与 k5.4 workflow 的差异：
#   - checkout 触发分支: openwrt-21.02(默认内核也是 5.4)
#   - 其余步骤、.config、artifact 路径相同

name: build-wpr003n-21.02

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-21.02
    paths:
      - 'target/linux/ath79/**'
      - '.github/workflows/build-wpr003n-21.02.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码 (openwrt-21.02 分支)
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath python3 python3-distutils
          # 21.02 同样可能用到 python2
          sudo apt-get install -y python2 || true

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config (仅 WPR003N)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_pisen_wpr003n=y

          # USB 模块 (与 k5.4 一致,方便对比)
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usb-modeswitch=y
          EOF
          make defconfig
          echo "=== 确认 wpr003n 已被选中 ==="
          grep -q "CONFIG_TARGET_ath79_generic_DEVICE_pisen_wpr003n=y" .config \
            && echo "OK: wpr003n selected" \
            || { echo "ERROR: wpr003n 未进入 .config"; exit 1; }

      - name: 下载依赖包
        run: make download -j8 V=s

      - name: 编译固件
        run: |
          # 先并行编译；失败则单线程重跑一遍以打印详细错误日志
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpr003n-firmware-21.02
          path: |
            bin/targets/ath79/generic/*pisen_wpr003n*
          if-no-files-found: warn